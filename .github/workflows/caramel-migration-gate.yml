name: Caramel Migration Gate

on:
  push:
    branches:
      - chore/caramel-github-migration-gate
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  caramel-migration-gate:
    name: Validate Caramel migration contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Caramel migration gate
        uses: ./.github/actions/caramel-migration-gate
        with:
          base-ref: ${{ github.event.pull_request.base.sha || 'origin/main' }}
